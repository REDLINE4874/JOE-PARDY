
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" charset="utf-8" defer></script>
    <title>JoyParty</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101828;
            color: white;
            text-align: center;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        header {
            padding: 20px;
        }

        h1 {
            margin: 5px;
            font-size: 42px;
        }


        /* =========================
           EQUIPOS
        ========================= */

        #equipos {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;

            padding: 10px 20px;
        }

        .equipo {

            background: #172554;

            border: 2px solid #2563EB;

            border-radius: 12px;

            min-width: 150px;

            padding: 12px;

            cursor: pointer;

            transition: 0.2s;
        }

        .equipo:hover {
            transform: scale(1.05);
        }

        .equipo.activo {

            border: 3px solid #22C55E;

            background: #1E3A8A;

            box-shadow: 0 0 15px rgba(34,197,94,0.5);
        }

        .nombre-equipo {

            font-size: 18px;

            font-weight: bold;
        }

        .puntuacion {

            font-size: 28px;

            margin-top: 5px;

            color: #4ADE80;
        }


        /* =========================
           BOTONES
        ========================= */

        .controles {

            margin: 15px;
        }

        button {

            border: none;

            padding: 12px 20px;

            margin: 5px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        .btn-nuevo {

            background: #2563EB;

            color: white;
        }

        .btn-reiniciar {

            background: #EF4444;

            color: white;
        }


        /* =========================
           TABLERO
        ========================= */

        .tablero {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 8px;

            padding: 20px;

            max-width: 1400px;

            margin: auto;
        }


        .categoria {

            background: #185FA5;

            padding: 15px 5px;

            min-height: 80px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            font-size: 16px;

            border-radius: 8px;
        }


        .puntos {

            background: #0C447C;

            padding: 25px 5px;

            font-size: 28px;

            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.2s;
        }

        .puntos:hover {

            background: #1976D2;

            transform: scale(1.03);
        }


        /* Pregunta utilizada */

        .puntos.usado {

            background: #374151;

            color: #6B7280;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           MODAL
        ========================= */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.85);

            align-items: center;

            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }


        .pregunta {

            background: #172554;

            padding: 40px;

            border-radius: 15px;

            max-width: 750px;

            width: 100%;
        }


        .pregunta h2 {

            color: #60A5FA;

            font-size: 32px;
        }


        .pregunta-texto {

            font-size: 28px;

            margin: 30px 0;
        }


        .respuesta {

            display: none;

            font-size: 25px;

            color: #4ADE80;

            margin: 20px 0;
        }


        .btn-respuesta {

            background: #2563EB;

            color: white;
        }


        .btn-correcto {

            background: #22C55E;

            color: white;

            display: none;
        }


        .btn-incorrecto {

            background: #EF4444;

            color: white;

            display: none;
        }


        .btn-cerrar {

            background: #6B7280;

            color: white;
        }


        /* =========================
           CONFIGURACIÓN EQUIPOS
        ========================= */

        #configEquipos {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.9);

            align-items: center;

            justify-content: center;

            z-index: 2000;

            padding: 20px;
        }


        .config {

            background: #172554;

            padding: 30px;

            border-radius: 15px;

            width: 100%;

            max-width: 500px;
        }


        .config h2 {

            margin-top: 0;
        }


        .campo-equipo {

            display: flex;

            margin: 8px 0;
        }


        .campo-equipo input {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 6px;

            font-size: 16px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media(max-width:900px) {

            .tablero {

                grid-template-columns:
                    repeat(4,1fr);
            }

        }


        @media(max-width:600px) {

            h1 {

                font-size: 32px;
            }

            .tablero {

                grid-template-columns:
                    repeat(2,1fr);
            }

            .pregunta-texto {

                font-size: 22px;
            }

        }

    </style>

</head>
