
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyParty</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101828;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 20px 0;
            font-size: 40px;
        }

        .tablero {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }

        .categoria {
            background: #185FA5;
            padding: 15px 5px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
        }

        .puntos {
            background: #0C447C;
            padding: 25px 5px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .puntos:hover {
            background: #1976D2;
            transform: scale(1.03);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pregunta {
            background: #172554;
            padding: 40px;
            border-radius: 15px;
            max-width: 700px;
            width: 100%;
        }

        .pregunta h2 {
            color: #60A5FA;
        }

        .pregunta-texto {
            font-size: 28px;
            margin: 30px 0;
        }

        .respuesta {
            display: none;
            font-size: 25px;
            color: #4ADE80;
            margin: 20px 0;
        }

        button {
            border: none;
            padding: 14px 25px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
        }

        .btn-respuesta {
            background: #22C55E;
            color: white;
        }

        .btn-cerrar {
            background: #EF4444;
            color: white;
        }

        @media (max-width: 900px) {
            .tablero {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 600px) {
            .tablero {
                grid-template-columns: repeat(2, 1fr);
            }

            .pregunta-texto {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- ==================== MODAL ==================== -->

    <div class="modal" id="modal">

        <div class="pregunta">

            <h2 id="valor"></h2>

            <div
                class="pregunta-texto"
                id="pregunta">
            </div>

            <div
                class="respuesta"
                id="respuesta">
            </div>

            <button
                class="btn-respuesta"
                onclick="mostrarRespuesta()">
                👁️ Mostrar respuesta
            </button>

            <button
                class="btn-cerrar"
                onclick="cerrarPregunta()">
                ✖ Cerrar
            </button>

        </div>

    </div>


    <script>

        let respuestaActual = "";


        function mostrarPregunta(
            pregunta,
            respuesta,
            puntos
        ) {

            document.getElementById("modal").style.display = "flex";

            document.getElementById("valor").textContent =
                puntos + " PUNTOS";

            document.getElementById("pregunta").textContent =
                pregunta;

            respuestaActual = respuesta;

            document.getElementById("respuesta").style.display =
                "none";

            document.getElementById("respuesta").textContent =
                "";

        }


        function mostrarRespuesta() {

            document.getElementById("respuesta").textContent =
                "✅ " + respuestaActual;

            document.getElementById("respuesta").style.display =
                "block";

        }


        function cerrarPregunta() {

            document.getElementById("modal").style.display =
                "none";

        }

    </script>
