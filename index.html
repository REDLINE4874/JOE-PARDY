<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoyParty</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#101828;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

header{
    padding:20px;
    text-align:center;
    background:#0c447c;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

h1{
    margin-bottom:18px;
    font-size:clamp(28px,5vw,45px);
}

.controles{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-principal{
    background:#185fa5;
    color:white;
}

.btn-secundario{
    background:#344054;
    color:white;
}

button:hover{
    opacity:.88;
}

/* MARCADOR */
#equipos{
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:12px;
    flex-wrap:wrap;
    padding:18px 15px;
    background:#172033;
}

.equipo{
    min-width:150px;
    padding:12px 18px;
    border:2px solid transparent;
    border-radius:10px;
    background:#26334a;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.equipo:hover{
    transform:translateY(-2px);
}

.equipo.activo{
    border-color:#ffd166;
    box-shadow:0 0 15px rgba(255,209,102,.35);
}

.equipo .turno{
    display:block;
    min-height:14px;
    color:#ffd166;
    font-size:12px;
    font-weight:bold;
    margin-bottom:4px;
}

.equipo .nombre{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

.equipo .score{
    font-size:25px;
    font-weight:bold;
}

/* TABLERO */
.tablero-wrap{
    width:100%;
    padding:20px;
}

.tablero{
    display:grid;
    grid-template-columns:repeat(14,minmax(115px,1fr));
    gap:8px;
    width:100%;
}

.columna-categoria{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
}

.categoria{
    background:#0c447c;
    min-height:78px;
    padding:10px 6px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:bold;
    border-radius:8px;
    font-size:14px;
    line-height:1.25;
}

.puntos{
    width:100%;
    min-height:78px;
    background:#185fa5;
    color:#ffd166;
    border:none;
    border-radius:8px;
    font-size:23px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    padding:8px;
}

.puntos:hover:not(.usado){
    background:#2377c5;
    transform:scale(1.03);
}

.puntos.usado{
    background:#253044;
    color:#667085;
    cursor:not-allowed;
    opacity:.55;
}

/* MODALES */
.modal-fondo{
    display:none;
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.78);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-y:auto;
}

.modal{
    width:min(700px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#172033;
    border-radius:16px;
    padding:28px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.modal h2{
    color:#ffd166;
    margin-bottom:20px;
    font-size:32px;
}

.modal .pregunta{
    font-size:23px;
    line-height:1.4;
    margin-bottom:22px;
    word-wrap:break-word;
}

.respuesta{
    display:none;
    background:#26334a;
    border-radius:10px;
    padding:18px;
    margin-bottom:20px;
    font-size:20px;
    color:#8ff0b0;
    word-wrap:break-word;
}

.botones-modal{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.btn-respuesta{
    background:#344054;
    color:white;
}

.btn-correcto{
    background:#20a464;
    color:white;
}

.btn-incorrecto{
    background:#d64545;
    color:white;
}

.btn-cerrar{
    background:#667085;
    color:white;
}

/* CONFIGURACIÓN */
.config-modal{
    width:min(600px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#172033;
    border-radius:16px;
    padding:28px;
}

.config-modal h2{
    margin-bottom:10px;
    text-align:center;
}

.config-modal p{
    text-align:center;
    color:#98a2b3;
    margin-bottom:20px;
}

.inputs-equipos{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.inputs-equipos input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#26334a;
    color:white;
    outline:none;
}

.inputs-equipos input:focus{
    box-shadow:0 0 0 2px #185fa5;
}

.config-botones{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

/* LAPTOPS / TABLETS */
@media(max-width:1400px){
    .tablero{
        grid-template-columns:repeat(7,minmax(130px,1fr));
    }
}

@media(max-width:900px){
    .tablero{
        grid-template-columns:repeat(4,minmax(145px,1fr));
    }

    .tablero-wrap{
        padding:15px;
    }
}

/* CELULARES */
@media(max-width:600px){
    header{
        padding:16px 12px;
    }

    h1{
        font-size:30px;
        margin-bottom:14px;
    }

    .controles{
        flex-direction:column;
        width:100%;
        max-width:320px;
        margin:auto;
    }

    .controles button{
        width:100%;
    }

    #equipos{
        padding:12px 8px;
        gap:7px;
    }

    .equipo{
        flex:1 1 125px;
        min-width:115px;
        padding:10px 12px;
    }

    .equipo .score{
        font-size:22px;
    }

    .tablero-wrap{
        padding:10px;
    }

    .tablero{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:7px;
    }

    .columna-categoria{
        gap:6px;
    }

    .categoria{
        min-height:64px;
        font-size:12px;
        padding:7px 4px;
    }

    .puntos{
        min-height:56px;
        font-size:20px;
    }

    .modal-fondo{
        padding:10px;
    }

    .modal{
        width:100%;
        max-height:94vh;
        padding:18px;
        border-radius:13px;
    }

    .modal h2{
        font-size:27px;
        margin-bottom:14px;
    }

    .modal .pregunta{
        font-size:19px;
        margin-bottom:18px;
    }

    .respuesta{
        font-size:18px;
        padding:15px;
    }

    .botones-modal{
        flex-direction:column;
    }

    .botones-modal button{
        width:100%;
    }

    .config-modal{
        padding:20px;
    }

    .inputs-equipos{
        grid-template-columns:1fr;
    }

    .config-botones{
        flex-direction:column;
    }

    .config-botones button{
        width:100%;
    }
}

/* CELULARES PEQUEÑOS */
@media(max-width:380px){
    h1{
        font-size:26px;
    }

    .tablero{
        gap:5px;
    }

    .categoria{
        min-height:58px;
        font-size:11px;
    }

    .puntos{
        min-height:50px;
        font-size:18px;
        padding:5px;
    }

    .equipo{
        flex-basis:105px;
        min-width:105px;
    }
}

/* TOUCH */
@media(hover:none){
    .puntos:hover:not(.usado){
        background:#185fa5;
        transform:none;
    }

    .equipo:hover{
        transform:none;
    }
}
</style>

                🚀 Comenzar
            </button>

            <button class="btn-cerrar" onclick="cerrarConfiguracion()">
                Cancelar
            </button>
        </div>
    </div>
</div>

<script>
let equipos = [];
let equipoActivo = 0;
let respuestaActual = "";
let puntosActuales = 0;
let casillaActual = null;

function abrirConfiguracion(){
    document.getElementById("configEquipos").style.display = "flex";
}

function cerrarConfiguracion(){
    document.getElementById("configEquipos").style.display = "none";
}

function crearEquipos(){

    const nombres = [];

    for(let i = 1; i <= 6; i++){
        const nombre = document.getElementById("equipo" + i).value.trim();

        if(nombre){
            nombres.push(nombre);
        }
    }

    if(nombres.length < 2){
        alert("Debes crear al menos 2 equipos.");
        return;
    }

    equipos = nombres.map(nombre => ({
        nombre: nombre,
        puntos: 0
    }));

    equipoActivo = 0;

    actualizarMarcador();
    cerrarConfiguracion();
}

function actualizarMarcador(){

    const contenedor = document.getElementById("equipos");

    contenedor.innerHTML = "";

    equipos.forEach((equipo, index) => {

        const div = document.createElement("div");

        div.className = "equipo";

        if(index === equipoActivo){
            div.classList.add("activo");
        }

        div.innerHTML = `
            <span class="turno">
                ${index === equipoActivo ? "🎯 TURNO" : ""}
            </span>

            <span class="nombre">
                ${equipo.nombre}
            </span>

            <span class="score">
                ${equipo.puntos}
            </span>
        `;

        div.onclick = () => {
            equipoActivo = index;
            actualizarMarcador();
        };

        contenedor.appendChild(div);
    });
}

function mostrarPregunta(elemento, pregunta, respuesta, puntos){

    if(elemento.classList.contains("usado")){
        return;
    }

    if(equipos.length === 0){
        alert("Primero debes crear los equipos.");
        return;
    }

    casillaActual = elemento;
    respuestaActual = respuesta;
    puntosActuales = puntos;

    document.getElementById("valor").textContent =
        puntos + " puntos";

    document.getElementById("pregunta").textContent =
        pregunta;

    document.getElementById("respuesta").textContent =
        respuesta;

    document.getElementById("respuesta").style.display = "none";

    document.getElementById("modal").style.display = "flex";
}

function mostrarRespuesta(){

    document.getElementById("respuesta").style.display = "block";
}

function respuestaCorrecta(){

    if(!equipos.length) return;

    equipos[equipoActivo].puntos += puntosActuales;

    finalizarPregunta();
}

function respuestaIncorrecta(){

    if(!equipos.length) return;

    equipos[equipoActivo].puntos -= puntosActuales;

    finalizarPregunta();
}

function finalizarPregunta(){

    if(casillaActual){
        casillaActual.classList.add("usado");
        casillaActual.disabled = true;
    }

    siguienteEquipo();
    cerrarPregunta();
    actualizarMarcador();
}

function siguienteEquipo(){

    equipoActivo++;

    if(equipoActivo >= equipos.length){
        equipoActivo = 0;
    }
}

function cerrarPregunta(){

    document.getElementById("modal").style.display = "none";

    respuestaActual = "";
    puntosActuales = 0;
    casillaActual = null;
}

function reiniciarJuego(){

    if(equipos.length > 0){
        equipos.forEach(equipo => {
            equipo.puntos = 0;
        });

        equipoActivo = 0;
        actualizarMarcador();
    }

    document.querySelectorAll(".puntos").forEach(casilla => {
        casilla.classList.remove("usado");
        casilla.disabled = false;
    });

    cerrarPregunta();
}
</script>

</body>
</html>
